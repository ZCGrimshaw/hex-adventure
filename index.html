<meta name="theme-color" content="#140c26">
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden; }
  * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
  body, canvas#c, .ui, .modal, button { -webkit-user-select: none; user-select: none; }
  textarea, input { -webkit-user-select: text; user-select: text; }
  canvas#c, button { outline: none; }
  body { font-family: Verdana, Arial, sans-serif; color:#e8f0e8; }
  canvas#c { display:block; touch-action:none; }
  .ui { position:fixed; font-weight:700; text-shadow:0 1px 0 #000; }
  .panel { background:linear-gradient(#17271dee,#0b140fee); border:2px solid #45624f; border-radius:7px; box-shadow:inset 0 0 0 1px #000, 0 3px 0 #0008; padding:8px 10px; }
  img.px, .slot img, #gear img, .rec img { image-rendering:pixelated; image-rendering:crisp-edges; }
  #stat { left:10px; top:10px; width:200px; }
  .skulls { display:flex; gap:3px; margin-bottom:4px; } .skulls img { width:22px; height:22px; }
  .bar { position:relative; height:16px; background:#050805; border:2px solid #000; box-shadow:0 0 0 1px #3a4a3f; margin-top:5px; overflow:hidden; border-radius:3px; }
  .bar i { position:absolute; left:0; top:0; bottom:0; transition:width .25s; }
  .bar i:after { content:''; position:absolute; left:0; right:0; top:0; height:40%; background:#ffffff30; }
  .bar span { position:relative; font-size:11px; line-height:16px; padding-left:5px; }
  .hp i { background:linear-gradient(#ee5560,#a8202c); } .mp i { background:linear-gradient(#5a82f0,#2a46b8); } .xp i { background:linear-gradient(#ecc848,#9a7410); }
  .small { font-size:11px; margin-top:6px; line-height:1.55; font-weight:400; }
  .small b { font-weight:700; }
  #gear { right:10px; top:10px; width:250px; font-size:11px; line-height:1.3; }
  #gear h4 { margin:0 0 4px; font-size:12px; color:#8dffa0; cursor:pointer; letter-spacing:1px; }
  #gear .row { display:flex; align-items:center; gap:5px; font-weight:400; white-space:nowrap; overflow:hidden; margin:2px 0; }
  #gear .row img { width:22px; height:22px; flex:none; background:#0006; border-radius:3px; }
  #gear .nm { overflow:hidden; text-overflow:ellipsis; }
  #gear .lbl { color:#8fa898; width:44px; flex:none; font-weight:700; }
  #gear .sp { cursor:pointer; color:#c8b8ff; }
  #gear.min .body { display:none; }
  #zoomBtns { left:8px; bottom:96px; display:flex; flex-direction:column; gap:6px; pointer-events:auto; }
  #zoomBtns button { width:40px; height:40px; border-radius:10px; border:1px solid #45624f; background:#0a120dcc; color:#d8f0e0; font:700 22px/1 system-ui,sans-serif; padding:0; cursor:pointer; touch-action:manipulation; }
  #zoomBtns button:active { background:#1d3a28; border-color:#ffe14a; }
  #tip { left:0; right:0; top:12px; text-align:center; font-size:13px; pointer-events:none; }
  #tip span { background:#0a120ddd; border:1px solid #45624f; padding:4px 10px; border-radius:5px; display:none; }
  #toast { left:0; right:0; top:20%; text-align:center; font-size:16px; pointer-events:none; opacity:0; transition:opacity .4s; padding:0 10px; }
  #toast span { background:#000b; padding:6px 14px; border-radius:6px; border:1px solid #ffffff22; display:inline-block; max-width:620px; }
  #bottom { left:0; right:0; bottom:8px; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none; }
  #actions { display:flex; justify-content:center; gap:8px; flex-wrap:wrap; padding:0 8px; max-width:96vw; }
  #bagbar { display:flex; flex-direction:column; gap:5px; align-items:center; pointer-events:auto; padding:6px 8px; }
  #spellrow, #itemrow { display:flex; gap:8px; align-items:center; justify-content:center; flex-wrap:wrap; }
  #bookBtn { padding:4px 8px; font-size:11px; }
  #bag { display:flex; gap:5px; }
  .slot { position:relative; width:50px; height:52px; box-sizing:border-box; border:2px solid #4f6d5a; background:linear-gradient(#1c2c22,#0d1610); border-radius:6px;
          display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; font-size:9px; cursor:pointer; text-align:center; line-height:1.05; font-weight:700; overflow:hidden; }
  .slot.w2 { width:105px; flex-direction:row; gap:4px; }
  .slot img { width:32px; height:32px; flex:none; }
  .slot.empty { border-style:dashed; border-color:#2b3d31; background:#0a110d; cursor:default; }
  .slot.sel { border-color:#ffe14a; box-shadow:0 0 8px #ffe14a88; }
  .slot .n { max-width:100%; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; padding:0 2px; }
  .slot.w2 .n { white-space:normal; text-align:left; }
  .slot .eq { position:absolute; right:2px; top:2px; font-size:9px; background:#7dff8f; color:#000; border-radius:3px; padding:0 3px; text-shadow:none; }
  .btn, .act { font:700 13px Verdana, Arial, sans-serif; color:#0b1a10; background:linear-gradient(#a8ffb8,#5ee077); border:3px solid #0b1a10; border-radius:8px; cursor:pointer; box-shadow:0 3px 0 #237035; pointer-events:auto; text-shadow:none; }

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

    chance:p=>f()<p,

  };
}

// ---------- theory helpers (scale-index space) ----------
// idx is an absolute scale-degree index: idx 0 = tonic in MIDI octave -1.
function idx2midi(idx,c){return c.root + 12*Math.floor(idx/7) + MODES[c.mode][mod(idx,7)]}

function midi2idxDown(m,c){let i=midi2idxUp(m,c);while(idx2midi(i,c)>m)i--;return i}
function midi2idxNear(m,c){const u=midi2idxUp(m,c);return idx2midi(u,c)===m?u:u-1}

}
function chordName(deg,root,mode){
  const m=MODES[mode], r=m[deg], third=mod(m[(deg+2)%7]-r,12), fifth=mod(m[(deg+4)%7]-r,12);
  const pc=(root+r)%12; let q='', roman=['I','II','III','IV','V','VI','VII'][deg];

// ---------- data model ----------
/* Song spec (JSON, format "midi-song-generator", version 1):
   {
     format, version, meta:{title},
     global:{style,key,mode,bpm,energy(0-1),transition(0=smooth..1=abrupt),seed,timeSig:[4,4]},
     channels:{lead|harm|bass|drums|arp:{wave:'pulse'|'tri'|'noise',duty,vol,pan,mute,solo}},

     partMap:[{section:<id>,repeat:n}]

   Drums use p: 36 kick, 38 snare, 42 hat, 46 open hat, 49 crash. */

    lead:{wave:'pulse',duty:d.lead,vol:.8,pan:-.15,mute:false,solo:false},
    harm:{wave:'pulse',duty:d.harm,vol:.55,pan:.25,mute:false,solo:false},
    bass:{wave:'tri',duty:0,vol:1,pan:0,mute:false,solo:false},
    drums:{wave:'noise',duty:0,vol:.85,pan:0,mute:false,solo:false},
    arp:{wave:'pulse',duty:d.arp,vol:.4,pan:.3,mute:false,solo:false}

}
const TITLE_A=['Crystal','Iron','Storm','Shadow','Sky','Lost','Emerald','Neon','Crimson','Frozen','Solar','Hidden','Thunder','Silver'];

function makeSectionDef(song,type,id){

// normalise an imported / hand-written spec so the app can use it
function normaliseSong(s){
  if(!s||typeof s!=='object') throw new Error('Not a JSON object');
  if(!s.sections||!s.partMap) throw new Error('Missing "sections" or "partMap"');
  s.format='midi-song-generator'; s.version=1;
  s.meta=s.meta||{}; s.meta.title=s.meta.title||'Untitled';
  const g=s.global=s.global||{};
  if(!STYLES[g.style]) g.style='nes-action';
  if(!NOTE_NAMES.includes(g.key)) g.key='C';
  if(!MODES[g.mode]) g.mode=STYLES[g.style].modes[0];
  g.bpm=clamp(+g.bpm||140,40,260); g.energy=clamp(g.energy??.5,0,1); g.transition=clamp(g.transition??.35,0,1);
  g.seed=(g.seed>>>0)||newSeed(); g.timeSig=[4,4];

    def.name=def.name||SECTION_TYPES[def.type].name;
    def.bars=clamp(Math.round(def.bars||SECTION_TYPES[def.type].bars),1,64);
    def.seed=(def.seed>>>0)||mixSeed(g.seed,id); def.overrides=def.overrides||{};

      tr.seed=(tr.seed>>>0)||mixSeed(g.seed,id+'/'+tid);
      tr.notes=Array.isArray(tr.notes)?tr.notes.filter(n=>n&&isFinite(n.t)&&isFinite(n.p)).map(n=>({t:Math.max(0,Math.round(n.t)),d:Math.max(1,Math.round(n.d||STEP)),p:clamp(Math.round(n.p),0,127),v:clamp(n.v??.8,0,1)})):[];

function sectionCtx(song,def){
  const g=song.global,o=def.overrides||{},style=STYLES[g.style];
  const typeE=(SECTION_TYPES[def.type]||SECTION_TYPES.verse).energy;
  const energy=o.energy!=null?o.energy:clamp(typeE+(g.energy-.5)*.7,0,1);
  const smooth=1-g.transition;
  return {style,type:def.type,bars:def.bars,root:keyPc(o.key||g.key),mode:o.mode||g.mode,energy,smooth,fillChance:smooth*.85,chords:null,motifRhythm:null};

function genChords(c,r){
  const list=c.style.progs[c.type]||c.style.progs.verse, prog=r.pick(list), out=[];
  // swap out diminished / augmented chords the mode creates (e.g. vi° in Dorian)
  const fix=d=>{const q=chordQuality(d,c.mode);if(q!=='dim'&&q!=='aug')return d;return [3,4,0,5].find(x=>{const qq=chordQuality(x,c.mode);return qq==='maj'||qq==='min'})??0};
  for(let b=0;b<c.bars;b++) out.push(fix(prog[b%prog.length]));
  if(c.type!=='outro'&&c.bars>=8&&r.chance(.4)) out[c.bars-1]=fix(4); // turnaround on V
  return out;

// rhythm cells in 16th steps; negative = rest. [cell, weight at low density, weight at high density]
const CELLS=[
  [[4],3,.5],[[8],1.6,.15],[[2,2],2,2.4],[[3,1],1.2,1.4],[[-4],1,.2],[[-2,2],1,1],
  [[1,1,2],.4,1.6],[[2,1,1],.4,1.6],[[1,1,1,1],.1,1.3],[[6,2],1,.5]
];
function makeRhythm(r,bars,density){
  const total=bars*16,out=[];let s=0;
  while(s<total){
    const remain=total-s;
    const opts=CELLS.filter(c=>c[0].reduce((a,b)=>a+Math.abs(b),0)<=remain).map(c=>[c[0],c[1]*(1-density)+c[2]*density]);
    let cell=r.weighted(opts);
    if(s===0&&cell[0]<0) cell=[4];
    for(const st of cell){ if(st>0) out.push({s,d:st}); s+=Math.abs(st); }
  }
